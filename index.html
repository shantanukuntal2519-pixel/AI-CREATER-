<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fast AI Avatar Video Creator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 550px;
            width: 100%;
            text-align: center;
        }
        h1 { margin-bottom: 8px; color: #00fff0; font-size: 1.6rem; }
        p { font-size: 0.9rem; color: #cbd5e1; margin-bottom: 20px; }
        
        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }
        label { display: block; font-size: 0.85rem; margin-bottom: 5px; color: #94a3b8; }
        input[type="file"] {
            width: 100%;
            padding: 10px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid #334155;
            border-radius: 8px;
            color: white;
            cursor: pointer;
        }

        .preview-area {
            margin: 20px 0;
            position: relative;
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
        }
        canvas, video {
            width: 100%;
            max-height: 300px;
            object-fit: contain;
            display: block;
        }

        .progress-box {
            display: none;
            margin: 15px 0;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            height: 25px;
        }
        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #00fff0, #3b82f6);
            transition: width 0.05s linear;
        }
        .progress-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 0.85rem;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s ease;
            margin-top: 10px;
        }
        .btn-generate { background: #00fff0; color: #0f172a; }
        .btn-generate:hover { background: #00d8cc; }
        .btn-download { background: #22c55e; color: white; display: none; text-decoration: none; text-align: center; line-height: 2.5rem; }
        .btn-download:hover { background: #16a34a; }
        .btn:disabled { background: #475569; cursor: not-allowed; color: #94a3b8; }
        
        #status { margin-top: 10px; font-size: 0.85rem; color: #38bdf8; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Fast AI Avatar Creator</h1>
        <p>Ultra-fast Background Video Rendering & Dynamic Lip Sync</p>

        <div class="input-group">
            <label>1. Select Avatar Image:</label>
            <input type="file" id="imageInput" accept="image/*">
        </div>

        <div class="input-group">
            <label>2. Select Audio Track (MP3/WAV):</label>
            <input type="file" id="audioInput" accept="audio/*">
        </div>

        <div class="preview-area">
            <canvas id="videoCanvas" width="1280" height="720" style="display:none;"></canvas>
            <video id="videoPreview" controls style="display:none;"></video>
            <div id="placeholderText" style="padding: 40px; color: #64748b;">Image & Audio Upload Karein</div>
        </div>

        <div class="progress-box" id="progressContainer">
            <div class="progress-bar" id="progressBar"></div>
            <div class="progress-text" id="progressText">0%</div>
        </div>

        <button id="renderBtn" class="btn btn-generate" onclick="generateVideo()" disabled>Fast Generate Video</button>
        <a id="downloadBtn" class="btn btn-download" download="youtube_avatar_video.webm">Download Video</a>

        <div id="status"></div>
    </div>

    <script>
        const imageInput = document.getElementById('imageInput');
        const audioInput = document.getElementById('audioInput');
        const renderBtn = document.getElementById('renderBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const status = document.getElementById('status');
        const canvas = document.getElementById('videoCanvas');
        const ctx = canvas.getContext('2d');
        const videoPreview = document.getElementById('videoPreview');
        const placeholderText = document.getElementById('placeholderText');
        
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');

        let loadedImage = null;
        let loadedAudio = null;

        function checkInputs() {
            if (imageInput.files[0] && audioInput.files[0]) {
                renderBtn.disabled = false;
            }
        }

        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    loadedImage = new Image();
                    loadedImage.src = event.target.result;
                    loadedImage.onload = () => {
                        canvas.style.display = 'block';
                        placeholderText.style.display = 'none';
                        videoPreview.style.display = 'none';
                        downloadBtn.style.display = 'none';
                        renderFrame(0, 0);
                    };
                };
                reader.readAsDataURL(file);
            }
            checkInputs();
        });

        audioInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                loadedAudio = new Audio(URL.createObjectURL(file));
            }
            checkInputs();
        });

        // Dynamic Lip & Sway Frame Renderer
        function renderFrame(bodySway, audioVolume) {
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (!loadedImage) return;

            ctx.save();
            ctx.translate(canvas.width / 2, canvas.height / 2);
            ctx.rotate(bodySway);

            const scale = Math.min(canvas.width / loadedImage.width, canvas.height / loadedImage.height) * 0.85;
            const w = loadedImage.width * scale;
            const h = loadedImage.height * scale;
            const x = -w / 2;
            const y = -h / 2;

            // Base Image Draw
            ctx.drawImage(loadedImage, x, y, w, h);

            // Realistic Jaw/Lip Movement (Audio Amplitude Based Stretching)
            if (audioVolume > 8) {
                const lipYFactor = 0.55; 
                const lipHFactor = 0.25; 
                
                const lipSrcY = loadedImage.height * lipYFactor;
                const lipSrcH = loadedImage.height * lipHFactor;
                
                const lipDestY = y + (h * lipYFactor);
                const lipDestH = h * lipHFactor;

                const openShift = Math.min((audioVolume / 255) * 14, 16); 

                ctx.save();
                ctx.beginPath();
                ctx.rect(x, lipDestY, w, lipDestH + openShift);
                ctx.clip();
                
                // Slightly stretched lower mouth area to mimic real speech
                ctx.drawImage(
                    loadedImage, 
                    0, lipSrcY, loadedImage.width, lipSrcH, 
                    x, lipDestY + openShift, w, lipDestH
                );
                ctx.restore();
            }

            ctx.restore();
        }

        async function generateVideo() {
            if (!loadedImage || !loadedAudio) return;

            renderBtn.disabled = true;
            downloadBtn.style.display = 'none';
            videoPreview.style.display = 'none';
            canvas.style.display = 'block';
            progressContainer.style.display = 'block';
            
            status.innerText = "Fast rendering active... Doosra tab kholne par bhi speed slow nahi hogi.";
            progressBar.style.width = '0%';
            progressText.innerText = '0%';

            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const source = audioCtx.createMediaElementSource(loadedAudio);
            const analyser = audioCtx.createAnalyser();
            analyser.fftSize = 64;
            
            const dest = audioCtx.createMediaStreamDestination();
            source.connect(analyser);
            source.connect(dest);

            const canvasStream = canvas.captureStream(30);
            const combinedStream = new MediaStream([
                ...canvasStream.getVideoTracks(),
                ...dest.stream.getAudioTracks()
            ]);

            // High bitrate for clear output video
            const mediaRecorder = new MediaRecorder(combinedStream, { 
                mimeType: 'video/webm;codecs=vp8,opus',
                videoBitsPerSecond: 3000000 
            });
            const chunks = [];

            mediaRecorder.ondataavailable = (e) => {
                if (e.data.size > 0) chunks.push(e.data);
            };

            mediaRecorder.onstop = () => {
                const blob = new Blob(chunks, { type: 'video/webm' });
                const videoURL = URL.createObjectURL(blob);
                
                videoPreview.src = videoURL;
                videoPreview.style.display = 'block';
                canvas.style.display = 'none';
                
                downloadBtn.href = videoURL;
                downloadBtn.style.display = 'block';
                
                status.innerText = "Video Tayar hai! Fast Download karke YouTube par upload karein.";
                renderBtn.disabled = false;
                progressContainer.style.display = 'none';
            };

            loadedAudio.currentTime = 0;
            await loadedAudio.play();
            mediaRecorder.start();

            const duration = loadedAudio.duration;
            const dataArray = new Uint8Array(analyser.frequencyBinCount);
            let frameCounter = 0;

            // Fast Background-Resistant Rendering Loop
            const renderLoop = setInterval(() => {
                if (loadedAudio.ended || loadedAudio.paused) {
                    clearInterval(renderLoop);
                    progressBar.style.width = '100%';
                    progressText.innerText = '100%';
                    mediaRecorder.stop();
                    audioCtx.close();
                    return;
                }

                // 1. Progress Update
                const currentTime = loadedAudio.currentTime;
                const percent = Math.min(Math.round((currentTime / duration) * 100), 100);
                progressBar.style.width = percent + '%';
                progressText.innerText = percent + '%';

                // 2. Real-time Audio Amplitude
                analyser.getByteFrequencyData(dataArray);
                let avgVol = 0;
                for (let i = 0; i < dataArray.length; i++) {
                    avgVol += dataArray[i];
                }
                avgVol = avgVol / dataArray.length;

                // 3. Sway Calculation
                frameCounter++;
                const bodySway = Math.sin(frameCounter * 0.04) * 0.015;

                // 4. Render Frame
                renderFrame(bodySway, avgVol);

            }, 1000 / 30);
        }
    </script>
</body>
</html>
