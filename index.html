<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mera AI Avatar</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(45deg, #1a1a1a, #4a4a4a);
            color: white;
            font-family: sans-serif;
            text-align: center;
        }
        .card {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        .avatar {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 3px solid #00fff0;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="card">
        <img class="avatar" src="https://api.dicebear.com/7.x/bottts/svg?seed=Felix" alt="AI Avatar">
        <h1>Mera AI Creator Page</h1>
        <p>Welcome to my channel!</p>
    </div>
</body>
</html>
