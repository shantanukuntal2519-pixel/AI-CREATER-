<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro AI Avatar Video Creator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 580px;
            width: 100%;
            text-align: center;
        }
        h1 { margin-bottom: 8px; color: #00fff0; font-size: 1.6rem; }
        p { font-size: 0.9rem; color: #cbd5e1; margin-bottom: 20px; }
        
        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }
        label { display: block; font-size: 0.85rem; margin-bottom: 5px; color: #94a3b8; }
        input[type="file"], select, textarea {
            width: 100%;
            padding: 10px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid #334155;
            border-radius: 8px;
            color: white;
            font-size: 0.9rem;
        }
        textarea { resize: vertical; height: 70px; }

        .preview-area {
            margin: 20px 0;
            position: relative;
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas, video {
            max-width: 100%;
            max-height: 320px;
            object-fit: contain;
            display: block;
        }

        .progress-box {
            display: none;
            margin: 15px 0;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            height: 25px;
        }
        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #00fff0, #3b82f6);
            transition: width 0.05s linear;
        }
        .progress-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 0.85rem;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s ease;
            margin-top: 10px;
        }
        .btn-generate { background: #00fff0; color: #0f172a; }
        .btn-generate:hover { background: #00d8cc; }
        .download-container { margin-top: 15px; }
        .btn-download { 
            background: #22c55e; color: white; display: inline-block; 
            text-decoration: none; text-align: center; padding: 10px 15px; 
            border-radius: 8px; font-weight: bold; margin: 5px; font-size: 0.9rem;
        }
        .btn-download:hover { background: #16a34a; }
        .btn:disabled { background: #475569; cursor: not-allowed; color: #94a3b8; }
        
        #status { margin-top: 10px; font-size: 0.85rem; color: #38bdf8; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Pro AI Video Generator</h1>
        <p>Long Audio Support, Auto Subtitles & Portrait/Landscape Mode</p>

        <div class="input-group">
            <label>1. Select Avatar Image:</label>
            <input type="file" id="imageInput" accept="image/*">
        </div>

        <div class="input-group">
            <label>2. Select Audio Track (MP3/WAV - 8+ Min Supported):</label>
            <input type="file" id="audioInput" accept="audio/*">
        </div>

        <div class="input-group">
            <label>3. Video Mode (Landscape / Portrait Parts):</label>
            <select id="modeSelect">
                <option value="landscape">Landscape (YouTube Full Video - 16:9)</option>
                <option value="portrait">Portrait Shorts (9:16 - Auto 55s Parts)</option>
            </select>
        </div>

        <div class="input-group">
            <label>4. Hindi Subtitle Text (Optional):</label>
            <textarea id="subtitleInput" placeholder="Yahan apna bolne wala text ya subtitles likhein..."></textarea>
        </div>

        <div class="preview-area">
            <canvas id="videoCanvas" width="1280" height="720" style="display:none;"></canvas>
            <video id="videoPreview" controls style="display:none;"></video>
            <div id="placeholderText" style="padding: 40px; color: #64748b;">Files Upload Karein</div>
        </div>

        <div class="progress-box" id="progressContainer">
            <div class="progress-bar" id="progressBar"></div>
            <div class="progress-text" id="progressText">0%</div>
        </div>

        <button id="renderBtn" class="btn btn-generate" onclick="generateVideo()" disabled>Generate Video</button>
        <div id="downloadContainer" class="download-container"></div>

        <div id="status"></div>
    </div>

    <script>
        const imageInput = document.getElementById('imageInput');
        const audioInput = document.getElementById('audioInput');
        const modeSelect = document.getElementById('modeSelect');
        const subtitleInput = document.getElementById('subtitleInput');
        const renderBtn = document.getElementById('renderBtn');
        const downloadContainer = document.getElementById('downloadContainer');
        const status = document.getElementById('status');
        const canvas = document.getElementById('videoCanvas');
        const ctx = canvas.getContext('2d');
        const videoPreview = document.getElementById('videoPreview');
        const placeholderText = document.getElementById('placeholderText');
        
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');

        let loadedImage = null;
        let loadedAudio = null;

        function checkInputs() {
            if (imageInput.files[0] && audioInput.files[0]) {
                renderBtn.disabled = false;
            }
        }

        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    loadedImage = new Image();
                    loadedImage.src = event.target.result;
                    loadedImage.onload = () => {
                        canvas.style.display = 'block';
                        placeholderText.style.display = 'none';
                        videoPreview.style.display = 'none';
                        downloadContainer.innerHTML = '';
                        updateCanvasDimensions();
                        renderFrame(0, 0, "");
                    };
                };
                reader.readAsDataURL(file);
            }
            checkInputs();
        });

        audioInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                loadedAudio = new Audio(URL.createObjectURL(file));
            }
            checkInputs();
        });

        modeSelect.addEventListener('change', updateCanvasDimensions);

        function updateCanvasDimensions() {
            const mode = modeSelect.value;
            if (mode === 'portrait') {
                canvas.width = 720;
                canvas.height = 1280;
            } else {
                canvas.width = 1280;
                canvas.height = 720;
            }
            if (loadedImage) renderFrame(0, 0, "");
        }

        // Frame Renderer with Lip-Sync, Sway & Subtitles
        function renderFrame(bodySway, audioVolume, subtitleText) {
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (!loadedImage) return;

            ctx.save();
            ctx.translate(canvas.width / 2, canvas.height / 2);
            ctx.rotate(bodySway);

            const scale = Math.min(canvas.width / loadedImage.width, canvas.height / loadedImage.height) * 0.75;
            const w = loadedImage.width * scale;
            const h = loadedImage.height * scale;
            const x = -w / 2;
            const y = -h / 2;

            // Draw Avatar Image
            ctx.drawImage(loadedImage, x, y, w, h);

            // Lip Movement Effect
            if (audioVolume > 8) {
                const lipYFactor = 0.55; 
                const lipHFactor = 0.25; 
                const lipSrcY = loadedImage.height * lipYFactor;
                const lipSrcH = loadedImage.height * lipHFactor;
                const lipDestY = y + (h * lipYFactor);
                const lipDestH = h * lipHFactor;
                const openShift = Math.min((audioVolume / 255) * 14, 16); 

                ctx.save();
                ctx.beginPath();
                ctx.rect(x, lipDestY, w, lipDestH + openShift);
                ctx.clip();
                ctx.drawImage(
                    loadedImage, 
                    0, lipSrcY, loadedImage.width, lipSrcH, 
                    x, lipDestY + openShift, w, lipDestH
                );
                ctx.restore();
            }
            ctx.restore();

            // Render Subtitles at bottom
            if (subtitleText) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(50, canvas.height - 150, canvas.width - 100, 80);
                
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 32px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(subtitleText, canvas.width / 2, canvas.height - 110);
            }
        }

        async function generateVideo() {
            if (!loadedImage || !loadedAudio) return;

            renderBtn.disabled = true;
            downloadContainer.innerHTML = '';
            videoPreview.style.display = 'none';
            canvas.style.display = 'block';
            progressContainer.style.display = 'block';
            
            status.innerText = "Rendering active (Background tab safe)... Kripya wait karein.";
            progressBar.style.width = '0%';
            progressText.innerText = '0%';

            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const source = audioCtx.createMediaElementSource(loadedAudio);
            const analyser = audioCtx.createAnalyser();
            analyser.fftSize = 64;
            
            const dest = audioCtx.createMediaStreamDestination();
            source.connect(analyser);
            source.connect(dest);

            const canvasStream = canvas.captureStream(30);
            const combinedStream = new MediaStream([
                ...canvasStream.getVideoTracks(),
                ...dest.stream.getAudioTracks()
            ]);

            const mediaRecorder = new MediaRecorder(combinedStream, { 
                mimeType: 'video/webm;codecs=vp8,opus',
                videoBitsPerSecond: 2500000 
            });
            const chunks = [];

            mediaRecorder.ondataavailable = (e) => {
                if (e.data.size > 0) chunks.push(e.data);
            };

            mediaRecorder.onstop = () => {
                const fullBlob = new Blob(chunks, { type: 'video/webm' });
                const mode = modeSelect.value;
                downloadContainer.innerHTML = '';

                if (mode === 'portrait' && loadedAudio.duration > 55) {
                    // Split into 55-second parts for Shorts/Reels
                    status.innerText = "Video complete! 55-second ke parts me divide ho rahi hai...";
                    const totalDuration = loadedAudio.duration;
                    const partDurationSec = 55;
                    const partsCount = Math.ceil(totalDuration / partDurationSec);
                    
                    // Approximate slicing based on blob size ratio
                    const bytesPerSec = fullBlob.size / totalDuration;

                    for (let i = 0; i < partsCount; i++) {
                        const startByte = i * partDurationSec * bytesPerSec;
                        const endByte = Math.min((i + 1) * partDurationSec * bytesPerSec, fullBlob.size);
                        const partBlob = fullBlob.slice(startByte, endByte, 'video/webm');
                        const partUrl = URL.createObjectURL(partBlob);

                        const a = document.createElement('a');
                        a.href = partUrl;
                        a.download = `Avatar_Video_Bhag_${i + 1}.webm`;
                        a.className = 'btn-download';
                        a.innerText = `Download Bhag ${i + 1} (Part)`;
                        downloadContainer.appendChild(a);
                    }
                    status.innerText = "Sabhi Parts Tayar hain! Niche se download karein.";
                } else {
                    // Single Full Video Download (Landscape or short audio)
                    const videoURL = URL.createObjectURL(fullBlob);
                    videoPreview.src = videoURL;
                    videoPreview.style.display = 'block';
                    canvas.style.display = 'none';
                    
                    const a = document.createElement('a');
                    a.href = videoURL;
                    a.download = mode === 'portrait' ? 'Avatar_Shorts_Video.webm' : 'YouTube_Landscape_Video.webm';
                    a.className = 'btn-download';
                    a.innerText = 'Download Complete Video';
                    downloadContainer.appendChild(a);

                    status.innerText = "Video Successfully Tayar ho gayi hai!";
                }

                renderBtn.disabled = false;
                progressContainer.style.display = 'none';
            };

            loadedAudio.currentTime = 0;
            await loadedAudio.play();
            mediaRecorder.start();

            const duration = loadedAudio.duration;
            const dataArray = new Uint8Array(analyser.frequencyBinCount);
            let frameCounter = 0;
            const subtitlesList = subtitleInput.value.split('\n').filter(s => s.trim() !== "");

            // Robust render loop independent of background throttling
            const renderInterval = setInterval(() => {
                if (loadedAudio.ended || loadedAudio.paused) {
                    clearInterval(renderInterval);
                    progressBar.style.width = '100%';
                    progressText.innerText = '100%';
                    mediaRecorder.stop();
                    audioCtx.close();
                    return;
                }

                const currentTime = loadedAudio.currentTime;
                const percent = Math.min(Math.round((currentTime / duration) * 100), 100);
                progressBar.style.width = percent + '%';
                progressText.innerText = percent + '%';

                analyser.getByteFrequencyData(dataArray);
                let avgVol = 0;
                for (let i = 0; i < dataArray.length; i++) {
                    avgVol += dataArray[i];
                }
                avgVol = avgVol / dataArray.length;

                frameCounter++;
                const bodySway = Math.sin(frameCounter * 0.04) * 0.015;

                // Pick active subtitle based on audio progress time
                let activeSub = "";
                if (subtitlesList.length > 0) {
                    const subIndex = Math.floor((currentTime / duration) * subtitlesList.length);
                    activeSub = subtitlesList[subIndex] || "";
                }

                renderFrame(bodySway, avgVol, activeSub);

            }, 1000 / 30);
        }
    </script>
</body>
</html>
